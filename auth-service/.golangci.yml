run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosimple
    - bodyclose
    - gosec
    # misspell fica de fora: o dicionário é de inglês e acusa palavras em
    # português nos comentários ("Eles" -> "Eels", "Clientes" -> "Clients")

linters-settings:
  gosec:
    # G104 (erros não tratados) já é coberto pelo errcheck
    excludes:
      - G104
  errcheck:
    check-type-assertions: true

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
  max-issues-per-linter: 0
  max-same-issues: 0
