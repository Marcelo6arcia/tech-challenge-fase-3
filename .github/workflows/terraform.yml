# =============================================================================
# Pipeline de Infraestrutura como Código
# =============================================================================
# Em Pull Request: fmt, validate, análise de segurança do IaC (Checkov + Trivy
# config) e `terraform plan`, com o resultado comentado no próprio PR.
# Na main: `terraform apply` sob aprovação manual (GitHub Environment).
#
# "Se não está no código, não existe" também vale para a infraestrutura: nenhum
# apply sai da máquina de ninguém.
# =============================================================================

name: Terraform

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write
  security-events: write

env:
  # Precisa acompanhar a versao que escreveu o state. O Terraform LE um state
  # gravado por versao mais nova, mas se recusa a GRAVA-LO: com o CI em 1.13.3
  # e o state em 1.15.5, o plan passava e o apply falharia -- e a mensagem so
  # aparece depois da aprovacao manual, no pior momento possivel.
  #
  # Se alguem rodar apply local com uma versao mais nova, o state sobe junto e
  # esta linha precisa subir tambem. O caminho sem essa armadilha e nao aplicar
  # da maquina de ninguem, que e a tese da fase.
  TF_VERSION: "1.15.5"
  AWS_REGION: "us-east-1"
  WORKDIR: "terraform/envs/dev/infra"
  # CIDRs que alcançam o endpoint público da API do EKS. Vem de uma variável de
  # repositório, e não de um arquivo, porque *.tfvars é gitignored e o valor é
  # o IP de quem opera — que muda e não deveria ficar num repositório público.
  # Sem isso, a validação do módulo eks reprova o plan com mensagem explícita,
  # em vez de o EKS aplicar 0.0.0.0/0 sem avisar.
  TF_VAR_public_access_cidrs: ${{ vars.PUBLIC_ACCESS_CIDRS }}
  # O mesmo bucket que o -backend-config usa, agora tambem como variavel.
  # terraform.tfvars e gitignored, entao no CI state_bucket_name chegava vazio,
  # enable_terraform_plan_access virava false e o plano propunha DESTRUIR a
  # politica que da ao proprio CI permissao de rodar plan. O apply teria
  # quebrado o pipeline de forma permanente, e o erro seguinte (AccessDenied no
  # plan) nao apontaria para a causa.
  TF_VAR_state_bucket_name: ${{ secrets.TF_STATE_BUCKET }}

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Qualidade e segurança do código de infraestrutura
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Lint & Security (IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform/

      - name: Validar todos os módulos
        run: |
          set -e
          for dir in terraform/modules/*/; do
            echo "==> $dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate
          done

      - name: tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Rodar tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        continue-on-error: true
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true

      - name: Enviar SARIF do Checkov
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: checkov.sarif
          category: iac-checkov

      - name: Trivy — misconfiguration no IaC (bloqueia em CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/
          format: table
          severity: CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # Plan — sempre; o resultado vira comentário no PR
  # ---------------------------------------------------------------------------
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: static-analysis
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-plan-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=togglemaster/dev/infra.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform plan
        id: plan
        working-directory: ${{ env.WORKDIR }}
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan > plan.txt 2>&1
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"
          set -e
          tail -c 60000 plan.txt

      - name: Comentar o plan no Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8');
            const body = [
              '### Terraform Plan — ambiente dev',
              '',
              '<details><summary>Ver o plano completo</summary>',
              '',
              '```hcl',
              plan.length > 60000 ? plan.slice(-60000) : plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Falhar se o plan tiver erro
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Guardar o plano
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Apply — só na main e só depois de aprovação no Environment "aws-dev"
  # ---------------------------------------------------------------------------
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: aws-dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-terraform-apply-${{ github.run_id }}

      - name: terraform init
        working-directory: ${{ env.WORKDIR }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=togglemaster/dev/infra.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: terraform apply
        working-directory: ${{ env.WORKDIR }}
        run: terraform apply -input=false -auto-approve -lock-timeout=5m
